<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="1st Class Express Logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C875" />
      <stop offset="50%" stop-color="#CF9E45" />
      <stop offset="100%" stop-color="#A67B2E" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83045" />
      <stop offset="100%" stop-color="#B21828" />
    </linearGradient>
  </defs>

  <g transform="translate(0, -10)">
    <!-- The "1" -->
    <path d="M 100 130 L 140 100 L 190 100 L 190 290 L 140 290 L 140 130 Z" fill="url(#goldGrad)" />

    <!-- The "C" -->
    <path d="M 410 137 
             A 110 110 0 1 0 410 263 
             L 373 237 
             A 65 65 0 1 1 373 163 Z" 
          fill="url(#goldGrad)" />

    <!-- The "e" -->
    <g transform="translate(320, 200) scale(0.85) translate(-320, -200)">
      <path d="M 400 195
               C 400 155, 360 135, 320 135
               C 280 135, 255 160, 255 200
               C 255 240, 280 265, 320 265
               C 355 265, 385 250, 395 230
               L 360 220
               C 355 235, 340 240, 320 240
               C 295 240, 280 220, 280 205
               L 400 205
               Z
               M 280 185
               L 375 185
               C 370 160, 350 155, 320 155
               C 295 155, 285 170, 280 185
               Z" 
            fill="url(#redGrad)" fill-rule="evenodd" />
    </g>

    <!-- Road Swooshes -->
    <path d="M 90 330 Q 250 300 420 300 Q 250 290 80 320 Z" fill="url(#goldGrad)" />
    <path d="M 110 360 Q 250 320 390 310 Q 250 310 100 348 Z" fill="url(#goldGrad)" />
    <path d="M 95 340 Q 250 305 405 305" fill="none" stroke="url(#redGrad)" stroke-width="7" stroke-dasharray="24 12" stroke-linecap="round" />

    <!-- Text -->
    <text x="250" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="42" text-anchor="middle" letter-spacing="2">
      <tspan fill="url(#goldGrad)">1ST CLASS </tspan><tspan fill="url(#redGrad)">EXPRESS</tspan>
    </text>

    <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle" letter-spacing="3.5" fill="url(#goldGrad)">
      COMMITTED TO DELIVER A QUALITY SERVICE
    </text>
  </g>
</svg>
